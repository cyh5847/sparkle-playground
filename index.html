<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F3EDFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="반짝반짝 놀이터">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;padding:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>반짝반짝 놀이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{
  --bg:#F3EDFF; --card:#FFFFFF; --ink:#463A6B; --ink-soft:#7A6FA0;
  --coral:#FF7A8A; --mint:#4FD1A5; --sun:#FFD166; --sky:#6EC6FF; --lilac:#B49BFF; --peach:#FFB27A;
  --shadow:0 6px 0 rgba(70,58,107,.14);
  --shadow-press:0 2px 0 rgba(70,58,107,.14);
  --radius:22px;
  --font:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
  touch-action:manipulation;overflow:hidden}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit}
:focus-visible{outline:4px solid var(--sky);outline-offset:2px}

#app{position:relative;height:100%}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;
  background:
    radial-gradient(circle at 12% 8%, rgba(255,225,230,.9) 0 90px, transparent 91px),
    radial-gradient(circle at 90% 12%, rgba(221,244,255,.9) 0 70px, transparent 71px),
    radial-gradient(circle at 85% 88%, rgba(255,241,201,.9) 0 120px, transparent 121px),
    radial-gradient(circle at 8% 78%, rgba(223,248,236,.9) 0 80px, transparent 81px),
    var(--bg)}

/* ---------- 공통 버튼 ---------- */
.btn{font-size:1.3rem;color:var(--ink);background:var(--card);border:0;border-radius:999px;
  padding:12px 24px;min-height:60px;box-shadow:var(--shadow);cursor:pointer;line-height:1.1;
  display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(4px);box-shadow:var(--shadow-press)}
.btn.primary{background:linear-gradient(180deg,#FF93A0,#FF6F81);color:#fff;box-shadow:0 6px 0 #D9506A}
.btn.primary:active{box-shadow:0 2px 0 #D9506A}
.btn.mint{background:linear-gradient(180deg,#6BE0BC,#3EC49A);color:#fff;box-shadow:0 6px 0 #2E9E7A}
.btn.mint:active{box-shadow:0 2px 0 #2E9E7A}
.icon-btn{width:60px;height:60px;border-radius:50%;font-size:1.7rem;display:grid;place-items:center;
  padding:0;border:0;background:var(--card);box-shadow:var(--shadow);cursor:pointer;line-height:1}
.icon-btn:active{transform:translateY(4px);box-shadow:var(--shadow-press)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ---------- 상단 바 ---------- */
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px}
.bar h2{flex:1;margin:0;font-size:1.55rem;text-align:center;font-weight:400;text-wrap:balance}
.bar .meta{min-width:60px;text-align:right;font-size:1.25rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.play{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 16px 16px;gap:12px;overflow:auto}

/* ---------- 메뉴(허브) ---------- */
.hub{overflow:auto;padding:16px 16px 28px}
.hero{text-align:center;padding-block:4px}
.hero .mascot{width:190px;max-width:60%;height:auto;display:block;margin:0 auto;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 8px 0 rgba(70,58,107,.08))}
.hero h1{font-size:2.4rem;margin:2px 0 0;font-weight:400;letter-spacing:.02em;
  background:linear-gradient(90deg,#FF6F81,#B47CFF 55%,#4DA9FF);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 rgba(255,255,255,.9))}
.hero p{margin:4px 0 0;color:var(--ink-soft);font-size:1.15rem}
@keyframes bob{50%{transform:translateY(-7px)}}
.twinkle{position:absolute;font-size:1.1rem;color:#FFC93C;animation:tw 2.4s ease-in-out infinite;pointer-events:none;text-shadow:0 0 8px rgba(255,201,60,.6)}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(20deg)}}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:560px;margin:14px auto 0}
.tile{aspect-ratio:1;border:0;border-radius:var(--radius);color:var(--ink);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;box-shadow:var(--shadow);cursor:pointer;font-size:1.35rem;
  position:relative;padding:8px;overflow:hidden;
  background-image:radial-gradient(rgba(255,255,255,.6) 2.5px,transparent 3px);background-size:22px 22px}
.tile::after{content:"";position:absolute;inset:auto -30px -40px auto;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.45)}
.tile .emo{font-size:3.4rem;line-height:1;position:relative;filter:drop-shadow(0 5px 0 rgba(70,58,107,.12))}
.tile>span:last-child{position:relative}
.tile:active{transform:translateY(4px);box-shadow:var(--shadow-press)}
.tile.wide{grid-column:1/-1;aspect-ratio:auto;min-height:130px;flex-direction:row;gap:18px;font-size:1.6rem}
.tile.wide .emo{font-size:4.2rem}
.tile.wide small{display:block;font-size:1rem;color:var(--ink-soft);margin-top:2px}
.tile.c1{background-color:#FFE1E6}.tile.c2{background-color:#FFF1C9}.tile.c3{background-color:#DDF4FF}.tile.c4{background-color:#DFF8EC}.tile.c5{background-color:#EDE4FF}.tile.c6{background-color:#FFE9D6}
.tile .badge{position:absolute;top:10px;right:14px;background:var(--coral);color:#fff;font-size:.9rem;border-radius:999px;padding:2px 10px}
.mute{position:absolute;top:12px;right:16px;width:52px;height:52px;font-size:1.4rem;z-index:2}

.stickers{max-width:560px;margin:18px auto 0;background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);position:relative}
.stickers.all{background:linear-gradient(#fff,#fff) padding-box,linear-gradient(90deg,#FF7A8A,#FFD166,#4FD1A5,#6EC6FF,#B49BFF) border-box;border:4px solid transparent}
.stickers h3{margin:0 0 4px;font-size:1.25rem;font-weight:400}
.stickers p{margin:0 0 10px;color:var(--ink-soft);font-size:1rem}
.slots{display:flex;gap:12px;flex-wrap:wrap}
.slot{width:58px;height:58px;border-radius:16px;background:var(--bg);display:grid;place-items:center;font-size:1.9rem;position:relative}
.slot:not(.empty){background:linear-gradient(180deg,#FFF7D6,#FFE9A8);box-shadow:inset 0 0 0 3px #FFD166}
.slot.empty{opacity:.35;filter:grayscale(1)}
.slot .n{position:absolute;bottom:-6px;right:-6px;background:var(--coral);color:#fff;font-size:.85rem;border-radius:999px;padding:1px 7px;line-height:1.3}

/* ---------- 짝 맞추기 ---------- */
.memgrid{flex:1 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:440px;width:100%;margin:0 auto;align-content:center}
@media (orientation:landscape) and (max-height:520px){
  .memgrid{grid-template-columns:repeat(6,1fr);max-width:760px}
}
.card{aspect-ratio:1;perspective:700px;cursor:pointer;border:0;background:none;padding:0}
.card .in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.card.open .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:18px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-size:clamp(2rem,9vw,3rem);line-height:1}
.face.front{background:linear-gradient(160deg,#C4AFFF,#9E82FF);color:#fff;box-shadow:inset 0 0 0 4px rgba(255,255,255,.55),0 4px 0 rgba(70,58,107,.14)}
.face.front::before{content:"";position:absolute;inset:10px;border-radius:12px;border:2px dashed rgba(255,255,255,.55)}
.face.front span{position:relative;filter:drop-shadow(0 3px 0 rgba(0,0,0,.12))}
.face.back{background:#fff;transform:rotateY(180deg);box-shadow:inset 0 0 0 4px var(--sun),0 4px 0 rgba(70,58,107,.14)}
.card.done .face.back{box-shadow:inset 0 0 0 4px var(--mint),0 0 18px rgba(79,209,165,.6);background:#EBFFF5}
.card.done{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.1)}}

/* ---------- 색칠놀이 ---------- */
.color-stage{flex:1;min-height:220px;display:grid;place-items:center}
.color-stage svg{width:100%;height:100%;max-height:100%;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow),inset 0 0 0 6px #FFF1C9}
.csvg .fill{cursor:pointer;transition:fill .15s;stroke:#463A6B;stroke-width:3;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.csvg .line{fill:none;stroke:#463A6B;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;vector-effect:non-scaling-stroke}
.palette{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.swatch{width:50px;height:50px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px rgba(70,58,107,.15),0 4px 0 rgba(70,58,107,.12);cursor:pointer;padding:0;transition:transform .12s;
  background-image:radial-gradient(circle at 32% 28%,rgba(255,255,255,.55) 0 6px,transparent 7px)}
.swatch.on{transform:scale(1.18);box-shadow:0 0 0 4px var(--ink)}

/* ---------- 풍선 터뜨리기 ---------- */
.sky{flex:1;min-height:240px;position:relative;overflow:hidden;border-radius:var(--radius);
  background-color:#BDE6FF;background-size:cover;background-position:center bottom;touch-action:none;box-shadow:var(--shadow)}
.balloon{position:absolute;bottom:-190px;width:84px;height:180px;cursor:pointer;animation:rise linear forwards;will-change:transform;touch-action:none}
.balloon .body{width:84px;height:104px;border-radius:50%/46% 46% 54% 54%;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.8) 0,rgba(255,255,255,0) 34%),var(--c);
  box-shadow:inset -8px -10px 0 rgba(0,0,0,.08);animation:sway 2.2s ease-in-out infinite alternate}
.balloon .knot{width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:12px solid var(--c);margin:-4px auto 0}
.balloon .str{width:2px;height:56px;background:rgba(70,58,107,.35);margin:0 auto}
@keyframes rise{to{transform:translateY(calc(-100vh - 400px))}}
@keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.burst{position:absolute;transform:translate(-50%,-50%);font-size:2.8rem;animation:burst .5s forwards;pointer-events:none;line-height:1}
.ring{position:absolute;width:20px;height:20px;border-radius:50%;border:5px solid var(--c);transform:translate(-50%,-50%);animation:ring .45s ease-out forwards;pointer-events:none}
@keyframes burst{from{transform:translate(-50%,-50%) scale(.4);opacity:1}to{transform:translate(-50%,-50%) scale(1.6);opacity:0}}
@keyframes ring{to{transform:translate(-50%,-50%) scale(6);opacity:0;border-width:1px}}

/* ---------- 숫자 세기 ---------- */
.count-q{text-align:center;font-size:1.6rem;margin:0;text-wrap:balance}
.items{flex:1;min-height:150px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:10px;
  background:#fff;background-image:radial-gradient(rgba(180,155,255,.18) 2px,transparent 2.5px);background-size:20px 20px;
  border-radius:var(--radius);padding:12px;box-shadow:var(--shadow),inset 0 0 0 6px #EDE4FF;overflow:auto}
.item{width:clamp(56px,15vw,84px);height:clamp(56px,15vw,84px);display:grid;place-items:center;font-size:clamp(2rem,8vw,3rem);
  position:relative;border-radius:16px;cursor:pointer;border:0;background:none;padding:0;line-height:1}
.item.tapped{background:#FFF1C9;box-shadow:inset 0 0 0 3px #FFD166}
.item .num{position:absolute;top:-4px;right:-4px;background:var(--coral);color:#fff;font-size:1rem;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.answers{display:flex;gap:12px;justify-content:center}
.ans{flex:1;max-width:140px;min-height:80px;font-size:2.4rem;border-radius:var(--radius);border:0;background:#fff;box-shadow:var(--shadow);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.ans:nth-child(1){box-shadow:inset 0 0 0 4px #FFD1D8,var(--shadow)}
.ans:nth-child(2){box-shadow:inset 0 0 0 4px #CFF0E4,var(--shadow)}
.ans:nth-child(3){box-shadow:inset 0 0 0 4px #D6ECFF,var(--shadow)}
.ans:active{transform:translateY(4px);box-shadow:var(--shadow-press)}
.ans.ok{background:var(--mint);color:#fff;box-shadow:var(--shadow)}
.ans.no{background:#EEE9F7;color:#B9B0CF;animation:wobble .4s;box-shadow:var(--shadow)}
@keyframes wobble{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.dots{display:flex;gap:8px;justify-content:center}
.dot{width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 3px var(--sun)}
.dot.on{background:var(--sun)}

/* ---------- 공주 꾸미기 ---------- */
.stage{flex:1;min-height:240px;display:grid;place-items:center}
.stage svg{width:100%;height:100%;max-height:100%;border-radius:var(--radius);box-shadow:var(--shadow);background:#fff}
.tabs{display:flex;gap:8px}
.tab{flex:1;min-width:0;min-height:58px;border:0;border-radius:16px;background:#fff;font-size:.95rem;color:var(--ink);box-shadow:var(--shadow);cursor:pointer;padding:6px 2px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;white-space:nowrap;line-height:1.1}
.tab .t-emo{font-size:1.4rem;line-height:1}
.tab.on{background:linear-gradient(180deg,#FF93A0,#FF6F81);color:#fff;box-shadow:0 6px 0 #D9506A}
.optrows{display:flex;flex-direction:column;gap:6px}
.opts{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.opt{flex:0 0 auto;width:64px;height:64px;border-radius:18px;border:0;background:#fff;font-size:2rem;box-shadow:var(--shadow);cursor:pointer;display:grid;place-items:center;padding:0;line-height:1;overflow:hidden}
.opt.on{box-shadow:0 0 0 4px var(--ink),var(--shadow)}
.opt .sw{width:36px;height:36px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(0,0,0,.08);background-image:radial-gradient(circle at 32% 28%,rgba(255,255,255,.5) 0 5px,transparent 6px)}
.opt svg{width:56px;height:56px;border-radius:14px}

/* ---------- 그림 고르기 · 내 그림 ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 8px;scrollbar-width:thin;flex:0 0 auto}
.chip{flex:0 0 auto;border:0;border-radius:999px;background:#fff;color:var(--ink);font-size:1.05rem;padding:10px 16px;min-height:44px;box-shadow:var(--shadow);cursor:pointer}
.chip.on{background:linear-gradient(180deg,#FF93A0,#FF6F81);color:#fff;box-shadow:0 6px 0 #D9506A}
.pickgrid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:6px 16px 24px;align-content:start}
@media (min-width:600px){.pickgrid{grid-template-columns:repeat(4,1fr)}}
@media (min-width:900px){.pickgrid{grid-template-columns:repeat(5,1fr)}}
.pick,.work{border:0;background:#fff;border-radius:18px;padding:6px 6px 8px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center;color:var(--ink);font-size:1rem}
.pick svg,.work svg{width:100%;height:auto;aspect-ratio:1;border-radius:12px;background:#fff;display:block}
.pick:active,.work:active{transform:translateY(4px);box-shadow:var(--shadow-press)}
.pick .csvg .fill{cursor:pointer}
.empty{grid-column:1/-1;text-align:center;color:var(--ink-soft);font-size:1.15rem;padding:40px 10px;line-height:1.6}
.gpanel{max-width:420px}
.gv-svg svg{display:block;width:100%;height:auto;aspect-ratio:1;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 3px #EDE4FF}
.panel h2.plain{background:none;color:var(--ink);-webkit-text-fill-color:initial;font-size:1.5rem}

/* ---------- 점 잇기 ---------- */
.dsvg{width:100%;height:100%;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow),inset 0 0 0 6px #DDF4FF}
.dsvg .dpt{cursor:pointer}
.dsvg{touch-action:none}
.dsvg .dpt.done circle{fill:#4FD1A5;stroke:#4FD1A5}
.dsvg .dpt.done text{fill:#fff}
.dsvg .dpt.next circle{stroke:#FF7A8A;fill:#FFF1F3;animation:pulse 1s ease-in-out infinite}
.dsvg .dpt.wrong circle{stroke:#E0405A;fill:#FFD6DC;transition:none}
@keyframes pulse{50%{stroke-width:9}}

/* ---------- 스티커 꾸미기 ---------- */
.scene-stage{touch-action:none}
.scene-stage svg{cursor:crosshair;user-select:none}
.scene-stage svg text{user-select:none}

/* ---------- 실로폰 ---------- */
.xylo{flex:1;min-height:200px;display:flex;gap:8px;align-items:flex-end;justify-content:center;background:#fff;border-radius:var(--radius);padding:14px;box-shadow:var(--shadow),inset 0 0 0 6px #FFF1C9}
.bar-key{flex:1;max-width:64px;height:var(--h);min-height:90px;border:0;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0)),var(--c);box-shadow:0 6px 0 rgba(0,0,0,.15),inset 0 0 0 3px rgba(255,255,255,.35);cursor:pointer;color:#fff;font-size:1.3rem;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;position:relative;touch-action:none;transition:transform .08s}
.bar-key::before,.bar-key::after{content:"";position:absolute;left:50%;width:10px;height:10px;border-radius:50%;background:rgba(0,0,0,.18);transform:translateX(-50%)}
.bar-key::before{top:10px}.bar-key::after{bottom:44px}
.bar-key.hit{transform:translateY(5px) scale(.97);box-shadow:0 1px 0 rgba(0,0,0,.15),inset 0 0 0 3px rgba(255,255,255,.35)}
.bar-key.next{animation:glow .8s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 6px 0 rgba(0,0,0,.15),0 0 0 6px #FFD166,0 0 24px #FFD166}}

/* 그림판 크기 고정: 넓은 화면(iPad)에서 그림이 칸 밖으로 넘쳐 다른 요소 뒤로 숨는 문제 방지 */
.color-stage,.stage{position:relative}
.color-stage>svg,.stage>svg{position:absolute;inset:0;width:100%;height:100%;max-height:none}

/* ---------- 축하 화면 · 폭죽 ---------- */
.overlay{position:fixed;inset:0;background:rgba(70,58,107,.55);display:grid;place-items:center;z-index:50;padding:16px}
.panel{position:relative;overflow:hidden;background:#fff;border-radius:30px;padding:26px 20px 22px;text-align:center;max-width:360px;width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.25),inset 0 0 0 6px #FFF1C9;animation:popin .4s cubic-bezier(.2,1.4,.5,1)}
.panel .rays{position:absolute;left:50%;top:92px;width:420px;height:420px;transform:translate(-50%,-50%);border-radius:50%;
  background:repeating-conic-gradient(#FFE7A3 0 12deg,#FFF8E1 12deg 24deg);
  -webkit-mask:radial-gradient(circle,#000 20%,transparent 62%);mask:radial-gradient(circle,#000 20%,transparent 62%);
  animation:spin 16s linear infinite;pointer-events:none}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.panel .badge{position:relative;width:124px;height:124px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:4rem;line-height:1;
  background:#fff;box-shadow:0 0 0 7px #FFD166,0 0 0 13px #fff,0 10px 0 13px rgba(70,58,107,.08);animation:badge .6s cubic-bezier(.2,1.6,.5,1) both}
@keyframes badge{from{transform:scale(0) rotate(-30deg)}}
.panel .stars{position:relative;display:flex;justify-content:center;gap:6px;margin-top:10px;font-size:2rem;line-height:1}
.panel .stars span{display:inline-block;transform:scale(.55);filter:grayscale(1);opacity:.35;transition:transform .35s cubic-bezier(.2,1.8,.5,1),opacity .2s,filter .2s}
.panel .stars span:nth-child(2){font-size:2.6rem;margin-top:-8px}
.panel .stars span.lit{transform:scale(1);filter:none;opacity:1}
.panel h2{position:relative;margin:8px 0 2px;font-size:2.1rem;font-weight:400;
  background:linear-gradient(90deg,#FF6F81,#B47CFF 55%,#4DA9FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.panel p{position:relative;margin:0 0 12px;color:var(--ink-soft);font-size:1.15rem}
.panel .preview{position:relative;margin:0 auto 12px;width:min(100%,220px);border-radius:18px;background:#F7F3FF;padding:8px;box-shadow:inset 0 0 0 3px #EDE4FF}
.panel .preview svg{display:block;width:100%;height:150px;border-radius:12px;background:#fff}
.panel .preview small{display:block;margin-top:6px;color:var(--ink-soft);font-size:.95rem}
.panel .got{position:relative;display:inline-flex;align-items:center;gap:8px;margin:0 auto 16px;padding:8px 18px;border-radius:999px;

<script>
/* ===== 공통 도구 ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const josa = (word, a, b) => { // 받침 있으면 b(이/을), 없으면 a(가/를)
  const c = word.charCodeAt(word.length - 1) - 0xAC00;
  if (c < 0 || c > 11171) return a;
  return c % 28 === 0 ? a : b;
};

const store = {
  get(k, d) { try { const v = localStorage.getItem('sparkle.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('sparkle.' + k, JSON.stringify(v)); } catch (e) {} }
};

/* ===== 효과음 (Web Audio 합성, 외부 파일 없음) ===== */
const Snd = (() => {
  let ctx = null, muted = store.get('muted', false);
  // iPhone/iPad: 무음 모드에서도 소리가 나도록 '재생' 오디오로 지정 (Safari 16.4+ 지원, 그 외엔 무시됨)
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  function ac() {
    if (muted) return null;
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state !== 'running') ctx.resume().catch(() => {});
      return ctx;
    } catch (e) { return null; }
  }
  // 오디오 잠금 해제: 브라우저는 '손을 뗄 때(터치 끝)'에만 소리를 허용하는 경우가 많아서 그때마다 재개 + 무음 한 번 재생
  let unlocked = false;
  function unlock() {
    if (muted) return;
    const c = ac(); if (!c) return;
    if (!unlocked) { try { const b = c.createBuffer(1, 1, 22050), src = c.createBufferSource(); src.buffer = b; src.connect(c.destination); src.start(0); unlocked = true; } catch (e) {} }
  }
  ['pointerup', 'touchend', 'click', 'keydown'].forEach(t => document.addEventListener(t, unlock, { capture: true, passive: true }));
  document.addEventListener('visibilitychange', () => { if (!document.hidden && ctx && ctx.state !== 'running') ctx.resume().catch(() => {}); });
  function tone(f, t = 0, d = .15, type = 'sine', v = .25) {
    const c = ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain(), now = c.currentTime + t;
    o.type = type; o.frequency.setValueAtTime(f, now);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(v, now + .01);
    g.gain.exponentialRampToValueAtTime(.0001, now + d);
    o.connect(g).connect(c.destination);
    o.start(now); o.stop(now + d + .05);
  }
  return {
    tick() { tone(880, 0, .08, 'triangle', .15); },
    flip() { tone(520, 0, .07, 'triangle', .12); },
    ding() { tone(784, 0, .15, 'sine', .25); tone(1046, .12, .3, 'sine', .25); },
    buzz() { tone(220, 0, .18, 'square', .06); tone(196, .16, .25, 'square', .06); },
    pop() {
      const c = ac(); if (!c) return;
      const len = Math.floor(c.sampleRate * .12), b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
      const s = c.createBufferSource(); s.buffer = b;
      const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 900 + Math.random() * 700; f.Q.value = .8;
      const g = c.createGain(); g.gain.value = .6;
      s.connect(f).connect(g).connect(c.destination); s.start();
      tone(700 + Math.random() * 200, 0, .09, 'sine', .18);
    },
    fanfare() {
      [523, 659, 784, 1046].forEach((f, i) => tone(f, i * .12, .3, 'triangle', .2));
      tone(1318, .5, .7, 'sine', .22);
    },
    star(i) { tone(880 * Math.pow(1.25, i), 0, .25, 'sine', .22); tone(1760 * Math.pow(1.25, i), .05, .2, 'triangle', .08); },
    ctx: ac,
    toggle() { muted = !muted; store.set('muted', muted); return muted; },
    get muted() { return muted; }
  };
})();

/* 한국어 음성 안내 — 한국어 음성이 있는 기기에서만 재생 */
function say(text) {
  if (Snd.muted) return;
  try {
    if (!('speechSynthesis' in window)) return;
    const voice = speechSynthesis.getVoices().find(v => /^ko/i.test(v.lang));
    if (!voice) return;
    const u = new SpeechSynthesisUtterance(text);
    u.voice = voice; u.lang = 'ko-KR'; u.rate = .95; u.pitch = 1.15;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}
try { if ('speechSynthesis' in window) speechSynthesis.getVoices(); } catch (e) {}

/* ===== 화면 전환 ===== */
const games = {};
let current = 'hub';
function show(id) {
  if (games[current] && games[current].stop) games[current].stop();
  $$('.screen').forEach(s => { s.hidden = (s.id !== 's-' + id); });
  current = id;
  if (games[id] && games[id].start) games[id].start();
}
$$('[data-game]').forEach(b => b.addEventListener('click', () => { Snd.tick(); show(b.dataset.game); }));
$$('.home').forEach(b => b.addEventListener('click', () => { Snd.tick(); show('hub'); }));

const muteBtn = $('#mute');
function paintMute() { muteBtn.textContent = Snd.muted ? '🔇' : '🔊'; }
muteBtn.addEventListener('click', () => { const m = Snd.toggle(); paintMute(); if (!m) Snd.ding(); });
paintMute();

/* ===== 스티커 ===== */
const STICKER = { color: '🎨', dress: '👑', memory: '🐻', count: '⭐', dots: '✏️', scene: '🧸', xylo: '🎵', balloon: '🎈' };
const NAMES = { color: '색칠놀이', dress: '공주 꾸미기', memory: '짝 맞추기', count: '숫자 세기', dots: '점 잇기', scene: '스티커 꾸미기', xylo: '실로폰', balloon: '풍선 터뜨리기' };
let stickers = store.get('stickers', {});
function award(game) { stickers[game] = (stickers[game] || 0) + 1; store.set('stickers', stickers); }
function renderStickers() {
  const el = $('#slots'); el.innerHTML = ''; let total = 0, kinds = 0;
  for (const g of Object.keys(STICKER)) {
    const n = stickers[g] || 0; total += n; if (n) kinds++;
    const d = document.createElement('div');
    d.className = 'slot' + (n ? '' : ' empty');
    d.title = NAMES[g];
    d.innerHTML = `<span>${STICKER[g]}</span>${n ? `<span class="n">${n}</span>` : ''}`;
    el.appendChild(d);
  }
  const all = kinds === Object.keys(STICKER).length;
  $('#stickers').classList.toggle('all', all);
  $('#sticker-title').textContent = all ? '🏆 스티커를 다 모았어요!' : '🏅 내 스티커';
  $('#sticker-total').textContent = all ? `여덟 가지 놀이를 다 해냈어요! 스티커 ${total}개` : total ? `스티커를 ${total}개 모았어요!` : '게임을 끝내면 스티커를 받아요';
  try { const n = Works.list().length; const gb = $('#gal-badge'); if (gb) { gb.textContent = n ? n + '장' : ''; gb.hidden = !n; } } catch (e) {}
}
games.hub = { start: renderStickers };

/* ===== 축하 화면 · 토스트 ===== */
let starT = [];
function celebrate(game, msg, preview) {
  Snd.fanfare(); confetti(); award(game);
  $('#ov-emo').textContent = STICKER[game];
  $('#ov-title').textContent = pick(['참 잘했어요!', '와, 대단해요!', '최고예요!']);
  $('#ov-msg').textContent = msg;
  $('#ov-sticker').textContent = STICKER[game];
  const pv = $('#ov-preview');
  if (preview) { pv.innerHTML = preview; pv.hidden = false; } else { pv.innerHTML = ''; pv.hidden = true; }
  // 배지 다시 튀어나오기 + 별 3개 차례로 켜기
  const badge = $('#ov-badge'); badge.style.animation = 'none'; void badge.offsetWidth; badge.style.animation = '';
  starT.forEach(clearTimeout); starT = [];
  $$('#ov-stars span').forEach((s, i) => { s.classList.remove('lit'); starT.push(setTimeout(() => { s.classList.add('lit'); Snd.star(i); }, 500 + i * 380)); });
  $('#overlay').hidden = false;

/* ===== 폭죽 (Canvas) ===== */
const confetti = (() => {
  const cv = $('#confetti'), cx = cv.getContext('2d');
  let ps = [], raf = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.floor(innerWidth * dpr); cv.height = Math.floor(innerHeight * dpr);
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize); resize();
  const colors = ['#FF7A8A', '#FFD166', '#4FD1A5', '#6EC6FF', '#B49BFF', '#FFB27A'];
  function frame() {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    ps = ps.filter(p => p.y < innerHeight + 30 && p.life > 0);
    for (const p of ps) {
      p.vy += .22; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillStyle = p.c;
      cx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); cx.restore();
    }
    if (ps.length) raf = requestAnimationFrame(frame); else { cx.clearRect(0, 0, innerWidth, innerHeight); raf = 0; }
  }
  return function () {
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const n = reduce ? 24 : 170;
    for (let i = 0; i < n; i++) ps.push({
      x: innerWidth / 2 + (Math.random() - .5) * 160, y: innerHeight * .38,
      vx: (Math.random() - .5) * 16, vy: -Math.random() * 15 - 4,
      vr: (Math.random() - .5) * .3, rot: Math.random() * 6,
      s: 8 + Math.random() * 8, c: pick(colors), life: 160
    });
    if (!raf) raf = requestAnimationFrame(frame);
  };
})();

/* ===== 게임 1 · 짝 맞추기 ===== */
games.memory = (() => {
  const EMO = ['🐶', '🐱', '🐰', '🦊', '🐻', '🐼', '🐨', '🐷', '🐸', '🦄', '🐥', '🐙', '🐢', '🦋'];
  const grid = $('#memgrid'), meta = $('#mem-meta');
  const total = 6;
  let first = null, lock = false, found = 0;
  function start() {
    found = 0; first = null; lock = false;
    const set = shuffle(EMO).slice(0, total);
    grid.innerHTML = '';
    shuffle(set.concat(set)).forEach(e => {
      const c = document.createElement('button');
      c.className = 'card'; c.dataset.e = e; c.setAttribute('aria-label', '카드');
      c.innerHTML = `<div class="in"><div class="face front"><span>⭐</span></div><div class="face back">${e}</div></div>`;
      c.addEventListener('click', () => flip(c));
      grid.appendChild(c);
    });
    meta.textContent = `🐾 0/${total}`;
  }
  function flip(c) {
    if (lock || c.classList.contains('open')) return;
    Snd.flip(); c.classList.add('open');
    if (!first) { first = c; return; }
    lock = true;
    const a = first; first = null;
    if (a.dataset.e === c.dataset.e) {
      setTimeout(() => {
        a.classList.add('done'); c.classList.add('done'); lock = false; found++;
        meta.textContent = `🐾 ${found}/${total}`; Snd.ding();
        if (found === total) setTimeout(() => celebrate('memory', '동물 친구들을 다 찾았어요!'), 500);
      }, 350);
    } else {
      setTimeout(() => { a.classList.remove('open'); c.classList.remove('open'); lock = false; Snd.buzz(); }, 900);
    }
  }
  $('#mem-again').addEventListener('click', () => { Snd.tick(); start(); });
  return { start };
})();

    if (scene === 'land') { out += fr(0, 0, V, H) + (r.chance(.55) ? fe(r.range(40, 280), H, r.range(80, 170), r.range(22, 48)) : '') + fr(0, H, V, V - H); }
    else if (scene === 'night') { out += fr(0, 0, V, H) + (r.chance(.4) ? fe(r.range(40, 280), H, r.range(90, 170), r.range(20, 40)) : '') + fr(0, H, V, V - H); }
    else if (scene === 'room') { out += fr(0, 0, V, H) + fr(0, H, V, V - H); }
    else if (scene === 'sea') { out += fr(0, 0, V, H) + fr(0, H, V, V - H) + ln(`M0 ${H + 14}q20 -10 40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0`) + (r.chance(.6) ? fp(`M0 ${V - 34}q80 -18 160 0t160 0V${V}H0z`) : ''); }
    else { out += fr(0, 0, V, V); }

    // 주인공 배치 — 그림마다 실제 크기(가로 반폭 w, 위 t, 아래 b)로 계산
    const ext = sub => Object.assign({ w: 100, t: sub.float ? -105 : -112, b: sub.float ? 105 : 100 }, EXT[sub.n] || {});
    const placeStanding = (sub, sc, x, byWant) => { const e = ext(sub); sc = Math.min(sc, (V - 14) / (2 * e.w)); const by = Math.min(314, Math.max(byWant, (e.b - e.t) * sc + 6)); x = Math.max(e.w * sc + 5, Math.min(V - e.w * sc - 5, x)); boxes.push([x - e.w * sc, by - (e.b - e.t) * sc, x + e.w * sc, by]); return `<g transform="translate(${x} ${by - e.b * sc}) scale(${sc})">${sub.draw(r)}</g>`; };
    const placeFloat = (sub, sc, x, cy) => { const e = ext(sub); boxes.push([x - e.w * sc, cy + e.t * sc, x + e.w * sc, cy + e.b * sc]); return `<g transform="translate(${x} ${cy}) scale(${sc})">${sub.draw(r)}</g>`; };
    let subjects = '';
    const E = ext(subj);
    if (!subj.float) {
      s = Math.min(s, (V - 14) / (2 * E.w), 306 / (E.b - E.t));
      const ground = scene === 'plain' ? r.range(236, 300) : H + r.range(20, 66);
      if (s < .82 && r.chance(.55)) { // 작게 여러 개
        const n = r.pick([2, 2, 3]); const scs = []; let total = 0;
        for (let i = 0; i < n; i++) { const sc = s * r.range(.75, 1.15); scs.push(sc); total += 2 * E.w * sc; }
        if (total + (n - 1) * 8 <= 304) { let x = (V - total - (n - 1) * 8) / 2; for (let i = 0; i < n; i++) { const sc = scs[i]; subjects += placeStanding(subj, sc, x + E.w * sc, ground + r.range(-14, 14)); x += 2 * E.w * sc + 8; } }
        else subjects += placeStanding(subj, s, r.range(E.w * s + 6, V - E.w * s - 6), ground);
      } else {
        subjects += placeStanding(subj, s, r.range(E.w * s + 6, V - E.w * s - 6), ground);
        if (s <= 1.12 && r.chance(.65)) { // 곁들이 친구
          const cn = r.pick(CL.COMPANIONS); const c = S.find(z => z.n === cn); const cs = r.range(.28, .5); const ce = ext(c);
          const b = boxes[boxes.length - 1]; const side = r.chance(.5) ? -1 : 1;
          const cx = (side < 0 ? b[0] : b[2]) + side * (ce.w * cs + 6);
          if (cx - ce.w * cs > 4 && cx + ce.w * cs < V - 4 && c) subjects += placeStanding(c, cs, cx, ground + r.range(-8, 12));
        }
      }
    } else {
      let ylo, yhi; const hh = E.b - E.t;
      s = Math.min(s, (V - 14) / (2 * E.w));
      if (scene === 'sea') { if (subj.n === '배') { s = Math.min(s, (H + 16) / (E.b - E.t)); ylo = yhi = H + 20 - E.b * s; } else { s = Math.min(s, (V - H - 16) / hh); ylo = H - E.t * s + 6; yhi = V - E.b * s - 4; } }
      else if (scene === 'land' || scene === 'night') { s = Math.min(s, (H - 16) / hh); ylo = -E.t * s + 4; yhi = Math.max(ylo, H - E.b * s - 8); }
      else { s = Math.min(s, (V - 12) / hh); ylo = -E.t * s + 4; yhi = V - E.b * s - 4; }
      subjects += placeFloat(subj, s, r.range(E.w * s + 6, V - E.w * s - 6), r.range(ylo, Math.max(ylo, yhi)));
      if (s < .8 && r.chance(.5)) { const s2 = s * r.range(.5, .8); const p = tryPlace(2 * E.w * s2, hh * s2, E.w * s2 + 4, V - E.w * s2 - 4, ylo, Math.max(ylo, yhi)); if (p) subjects += placeFloat(subj, s2, p[0], p[1]); }
    }

    // 장식
    let decor = '';
    const skyTop = 12, skyBot = Math.max(30, (H || 200) - 30);
    if (scene === 'land' || scene === 'sea' || scene === 'sky') {
      if (r.chance(.7)) { const rr = r.range(16, 30); const p = tryPlace(rr * 2 + 44, rr * 2 + 44, rr + 26, V - rr - 26, rr + 26, Math.min(110, skyBot)); if (p) decor += sun(p[0], p[1], rr); }
      const nc = r.int(4); for (let i = 0; i < nc; i++) { const sc = r.range(.7, 1.4); const p = tryPlace(104 * sc, 46 * sc, 54 * sc, V - 54 * sc, skyTop + 24 * sc, skyBot); if (p) decor += cloud(p[0], p[1], sc); }
      if (r.chance(.5)) { const nb = 1 + r.int(3); for (let i = 0; i < nb; i++) { const p = tryPlace(30, 12, 20, V - 20, skyTop, skyBot); if (p) decor += bird(p[0], p[1]); } }
    }
    if (scene === 'night') {
      const rr = r.range(16, 26); const p = tryPlace(rr * 2 + 10, rr * 2 + 10, 30, V - 30, 30, 90); if (p) decor += moon(p[0], p[1], rr);
      const ns = 4 + r.int(6); for (let i = 0; i < ns; i++) { const z = r.range(6, 13); const q = tryPlace(z * 2 + 6, z * 2 + 6, 14, V - 14, 12, skyBot); if (q) decor += star4(q[0], q[1], z); }
    }
    if (scene === 'land' || scene === 'night') {
      const nf = 2 + r.int(4); for (let i = 0; i < nf; i++) { const k = r.int(3); const sc = r.range(.7, 1.2); const p = tryPlace(52 * sc, 50 * sc, 28 * sc, V - 28 * sc, H + 26 * sc, V - 26 * sc); if (!p) continue; if (k === 0) decor += flower(p[0], p[1] + 24 * sc, sc); else if (k === 1) decor += grass(p[0] - 10, p[1] + 8); else decor += mushroom(p[0], p[1] + 20 * sc, sc * .8); }
    }
    if (scene === 'sea') {
      const nb = 3 + r.int(5); for (let i = 0; i < nb; i++) { const rr = r.range(4, 10); const p = tryPlace(rr * 2 + 4, rr * 2 + 4, 12, V - 12, H + 10, V - 30); if (p) decor += bubble(p[0], p[1], rr); }
      const nw = 1 + r.int(3); for (let i = 0; i < nw; i++) { const h = r.range(40, 90); const p = tryPlace(30, h, 16, V - 16, V - h / 2 - 6, V - h / 2 - 4); if (p) decor += seaweed(p[0], V - 4, h); }
    }
    if (scene === 'plain') {
      const kinds = r.pick([['heart'], ['star'], ['dot'], ['heart', 'star'], ['star', 'dot']]);
      const nd = 4 + r.int(6); for (let i = 0; i < nd; i++) { const z = r.range(7, 16); const p = tryPlace(z * 2 + 8, z * 2 + 8, 14, V - 14, 14, V - 14); if (!p) continue; const k = r.pick(kinds); decor += k === 'heart' ? heart(p[0], p[1], z) : k === 'star' ? star4(p[0], p[1], z) : fc(p[0], p[1], z * .7); }
    }
    if (scene === 'room') {
      const b0 = boxes[0]; const wx = b0[0] > 150 ? r.range(30, Math.max(31, b0[0] - 60)) : r.range(Math.min(V - 70, b0[2] + 60), V - 40);
      const ww = 60, wh = 70, wy = r.range(24, Math.max(25, H - wh - 20));
      decor += fr(wx - ww / 2, wy, ww, wh, 6) + ln(`M${wx} ${wy}v${wh}M${wx - ww / 2} ${wy + wh / 2}h${ww}`);
      if (r.chance(.6)) decor += fe(b0[0] / 2 + b0[2] / 2, Math.min(V - 10, b0[3] + 4), Math.min(150, (b0[2] - b0[0]) / 2 + 40), 14);
      if (r.chance(.5)) { const p = tryPlace(50, 40, 30, V - 30, 20, H - 40); if (p) decor += fr(p[0] - 22, p[1] - 16, 44, 32, 3) + heart(p[0], p[1] - 4, 8); }
    }
    return out + decor + subjects;
  }

  function generate(id) {
    const [ci, seedS] = id.split('-'); const seed = parseInt(seedS, 10); const r = makeRng(seed);
    const cat = CATS[+ci]; const pool = cat === '전부' ? S : S.filter(z => z.cat === cat);
    const subj = pool[r.int(pool.length)];
    return { n: subj.n, svg: `<svg class="csvg" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${subj.n}">${compose(subj, r)}</svg>` };
  }
  const newId = ci => `${ci}-${Math.floor(Math.random() * 4294967295)}`;
  return { generate, newId };
})();

const Works = {
  list() { return store.get('works', []); },
  add(w) { const l = this.list(); l.unshift(w); if (l.length > 200) l.length = 200; store.set('works', l); },
  remove(t) { store.set('works', this.list().filter(w => w.t !== t)); },

};

    pal.innerHTML = '';
    COLORS.forEach(c => { const b = document.createElement('button'); b.className = 'swatch' + (c === cur ? ' on' : ''); b.style.background = c; b.setAttribute('aria-label', '색 ' + c); b.addEventListener('click', () => { cur = c; $$('.swatch', pal).forEach(x => x.classList.toggle('on', x === b)); Snd.tick(); }); pal.appendChild(b); });
  }
  function bind() { $$('.fill', stage).forEach(r => r.addEventListener('pointerdown', e => { e.preventDefault(); r.setAttribute('fill', cur); Snd.tick(); })); }
  function painted() { return $$('.fill', stage).filter(x => x.getAttribute('fill') !== '#fff').length; }
  function open(id) { curId = id; editing = null; const g = Scene.generate(id); curName = g.n; stage.innerHTML = g.svg; $('#color-name').textContent = '🎨 ' + curName; bind(); }
  function openWork(w) { curId = w.id; editing = w.t; curName = w.n; stage.innerHTML = w.svg; $('#color-name').textContent = '🎨 ' + curName; bind(); }

games.balloon = (() => {
  const sky = $('#sky'), meta = $('#bal-meta');
  const GOAL = 15, COLORS = ['#FF6B8A', '#FFD23F', '#5DD39E', '#5BB8FF', '#B28DFF', '#FF9E5E'];
  let score = 0, spawnT = 0, running = false;
  // 하늘·해·구름·언덕 배경 (SVG를 data URI로)
  const cloud = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})" fill="#fff" opacity=".95"><circle cx="0" cy="0" r="22"/><circle cx="26" cy="-10" r="28"/><circle cx="56" cy="0" r="22"/><rect x="-14" y="0" width="84" height="22" rx="11"/></g>`;
  const skySvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" preserveAspectRatio="xMidYMax slice">
    <rect width="400" height="600" fill="#B7E1FF"/><rect y="220" width="400" height="380" fill="#CDEBFF"/><rect y="420" width="400" height="180" fill="#E3F3FF"/>
    <circle cx="330" cy="86" r="58" fill="#FFE58A" opacity=".35"/><circle cx="330" cy="86" r="40" fill="#FFE58A"/>
    ${cloud(40, 130, 1)}${cloud(230, 210, .8)}${cloud(120, 330, .6)}${cloud(300, 400, .7)}
    <ellipse cx="80" cy="640" rx="280" ry="100" fill="#A8E6A1"/><ellipse cx="360" cy="660" rx="280" ry="120" fill="#8FD98A"/>
    <g fill="#FF8FB1"><circle cx="40" cy="560" r="6"/><circle cx="120" cy="575" r="6"/><circle cx="300" cy="570" r="6"/></g>
    <g fill="#FFD166"><circle cx="80" cy="580" r="6"/><circle cx="220" cy="565" r="6"/><circle cx="360" cy="585" r="6"/></g>
  </svg>`;
  sky.style.backgroundImage = 'url("data:image/svg+xml,' + encodeURIComponent(skySvg) + '")';
  function spawn() {
    if (!running) return;
    if ($$('.balloon', sky).length < 6) {
      const b = document.createElement('div');
      b.className = 'balloon'; b.style.setProperty('--c', pick(COLORS));
      const w = Math.max(sky.clientWidth, 120);
      b.style.left = (8 + Math.random() * (w - 100)) + 'px';
      b.style.animationDuration = (5.5 + Math.random() * 3) + 's';
      b.innerHTML = '<div class="body"></div><div class="knot"></div><div class="str"></div>';
      b.addEventListener('pointerdown', e => { e.preventDefault(); pop(b); });
      b.addEventListener('animationend', () => b.remove());
      sky.appendChild(b);
    }
    spawnT = setTimeout(spawn, 650 + Math.random() * 500);
  }
  function pop(b) {
    if (!running || b.classList.contains('popped')) return;
    b.classList.add('popped'); Snd.pop(); score++;
    meta.textContent = `🎈 ${score}/${GOAL}`;
    const r = b.getBoundingClientRect(), sr = sky.getBoundingClientRect();
    const x = (r.left - sr.left + r.width / 2) + 'px', y = (r.top - sr.top + 50) + 'px';
    const s = document.createElement('div');
    s.className = 'burst'; s.textContent = pick(['💥', '✨', '⭐', '💖']);
    s.style.left = x; s.style.top = y;
    const ring = document.createElement('div');
    ring.className = 'ring'; ring.style.setProperty('--c', b.style.getPropertyValue('--c')); ring.style.left = x; ring.style.top = y;
    sky.appendChild(ring); sky.appendChild(s);
    setTimeout(() => { s.remove(); ring.remove(); }, 600);
    b.remove();
    if (score >= GOAL) { stop(); setTimeout(() => celebrate('balloon', `풍선을 ${GOAL}개나 터뜨렸어요!`), 400); }
  }
  function start() {
    stop(); score = 0; running = true; meta.textContent = `🎈 0/${GOAL}`;
    $$('.balloon,.burst,.ring', sky).forEach(x => x.remove());
    spawn();
  }
  function stop() { running = false; clearTimeout(spawnT); }
  return { start, stop };
})();

/* ===== 게임 4 · 숫자 세기 ===== */
games.count = (() => {
  const ITEMS = [['🍎', '사과'], ['🍓', '딸기'], ['🐥', '병아리'], ['🌸', '꽃'], ['⭐', '별'], ['🦋', '나비'], ['🍪', '쿠키'], ['🎈', '풍선'], ['🐟', '물고기'], ['🍭', '사탕']];
  const ROUNDS = 5;
  const box = $('#items'), q = $('#count-q'), ans = $('#answers'), dots = $('#count-dots');
  let round = 0, n = 0, tapped = [], busy = false;
  function renderDots() {
    dots.innerHTML = '';
    for (let i = 0; i < ROUNDS; i++) { const d = document.createElement('div'); d.className = 'dot' + (i < round ? ' on' : ''); dots.appendChild(d); }
  }
  function next() {
    busy = false; tapped = [];
    const [emo, name] = pick(ITEMS);
    const min = round < 2 ? 1 : 3, max = round < 2 ? 5 : 10;
    n = min + rnd(max - min + 1);
    q.textContent = `${name}${josa(name, '가', '이')} 몇 개일까?`;
    box.innerHTML = '';
    for (let i = 0; i < n; i++) {
      const it = document.createElement('button');
      it.className = 'item'; it.textContent = emo; it.setAttribute('aria-label', name);
      it.addEventListener('click', () => tap(it));
      box.appendChild(it);
    }
    const set = new Set([n]);
    let guard = 0;
    while (set.size < 3 && guard++ < 50) set.add(Math.max(1, Math.min(10, n + rnd(5) - 2)));
    ans.innerHTML = '';
    shuffle([...set]).forEach(v => {
      const b = document.createElement('button');
      b.className = 'ans'; b.textContent = v;
      b.addEventListener('click', () => answer(b, v));
      ans.appendChild(b);
    });
    say(q.textContent);
  }
  function tap(it) {
    Snd.tick();
    const i = tapped.indexOf(it);
    if (i >= 0) { tapped.splice(i, 1); it.classList.remove('tapped'); const b = it.querySelector('.num'); if (b) b.remove(); }
    else tapped.push(it);
    tapped.forEach((x, k) => {
      x.classList.add('tapped');
      let b = x.querySelector('.num');
      if (!b) { b = document.createElement('span'); b.className = 'num'; x.appendChild(b); }
      b.textContent = k + 1;
    });
    if (i < 0) say(String(tapped.length));
  }
  function answer(b, v) {
    if (busy) return;
    if (v === n) {
      busy = true; b.classList.add('ok'); Snd.ding(); round++; renderDots(); say('딩동댕! 맞았어요');
      setTimeout(() => { if (round >= ROUNDS) celebrate('count', '숫자를 아주 잘 세었어요!'); else next(); }, 1000);
    } else {
      b.classList.add('no'); Snd.buzz(); say('다시 세어 볼까?');
    }
  }
  function start() { round = 0; renderDots(); next(); }
  $('#count-say').addEventListener('click', () => { Snd.tick(); say(q.textContent); });
  return { start };
})();

    { n: '빨강 하트', sleeve: '#FF8F8F', svg: '<path d="M120 176H180L200 236L242 362H58L100 236Z" fill="#FF5C5C"/><path d="M120 176H180L190 228H110Z" fill="#E03C3C"/><path d="M134 176H166L164 186Q150 194 136 186Z" fill="#fff"/><rect x="58" y="350" width="184" height="12" fill="#fff" opacity=".8"/><text x="150" y="300" font-size="24" text-anchor="middle">🤍</text><text x="110" y="340" font-size="20" text-anchor="middle">🤍</text><text x="190" y="340" font-size="20" text-anchor="middle">🤍</text>' },

  const ACC = [
    { n: '없음', label: '✖', svg: '' },
    { n: '왕관', label: '👑', svg: '<path d="M114 88L128 56L150 78L172 56L186 88Z" fill="#FFC72C" stroke="#E0A800" stroke-width="3" stroke-linejoin="round"/><rect x="112" y="84" width="76" height="9" rx="4" fill="#FFC72C" stroke="#E0A800" stroke-width="2"/><circle cx="128" cy="60" r="4" fill="#FF5C7A"/><circle cx="172" cy="60" r="4" fill="#7ED957"/><circle cx="150" cy="80" r="4" fill="#4FA8FF"/><circle cx="150" cy="88" r="3" fill="#FF5C7A"/>' },
    { n: '티아라', label: '💎', svg: '<path d="M118 90Q150 62 182 90" fill="none" stroke="#D9E3FF" stroke-width="8" stroke-linecap="round"/><path d="M118 90Q150 62 182 90" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="150" cy="73" r="8" fill="#8FD3FF"/><circle cx="134" cy="79" r="4" fill="#FF8FB1"/><circle cx="166" cy="79" r="4" fill="#FF8FB1"/>' },
    { n: '리본', label: '🎀', svg: '<text x="188" y="102" font-size="34" text-anchor="middle">🎀</text>' },
    { n: '꽃', label: '🌸', svg: '<text x="112" y="102" font-size="34" text-anchor="middle">🌸</text>' },
    { n: '안경', label: '👓', svg: '<g fill="none" stroke="#FF5C7A" stroke-width="3"><circle cx="133" cy="124" r="14"/><circle cx="167" cy="124" r="14"/><path d="M147 124h6M119 122l-8-4M181 122l8-4"/></g>' }
  ];
  const PET = [
    { n: '없음', label: '✖', svg: '' },
    { n: '토끼', label: '🐰' }, { n: '고양이', label: '🐱' }, { n: '강아지', label: '🐶' }, { n: '유니콘', label: '🦄' }, { n: '병아리', label: '🐥' }
  ].map(p => p.svg === undefined ? { ...p, svg: `<text x="252" y="358" font-size="52" text-anchor="middle">${p.label}</text><text x="278" y="300" font-size="16" text-anchor="middle">💗</text>` } : p);

  const cloud = (x, y, s, c = '#fff') => `<g transform="translate(${x} ${y}) scale(${s})" fill="${c}"><circle cx="0" cy="0" r="16"/><circle cx="20" cy="-8" r="21"/><circle cx="42" cy="0" r="16"/><rect x="-12" y="0" width="66" height="16" rx="8"/></g>`;
  const tulip = (x, y, c) => `<path d="M${x} ${y}v-26" stroke="#4CBF3F" stroke-width="4" stroke-linecap="round"/><path d="M${x - 10} ${y - 24}q10 12 20 0v-14q-5 8-10 0q-5 8-10 0z" fill="${c}"/>`;
  const flagsOn = (() => { const pts = [[30, 69], [70, 78], [110, 83], [150, 85], [190, 83], [230, 78], [270, 69]], cs = ['#FF7A8A', '#FFD166', '#4FD1A5', '#6EC6FF', '#B49BFF', '#FFB27A', '#FF7A8A']; return pts.map(([x, y], i) => `<path d="M${x - 12} ${y}L${x + 12} ${y}L${x} ${y + 22}Z" fill="${cs[i]}"/>`).join(''); })();
  const BG = [
    { n: '성', svg: `<rect width="300" height="400" fill="#DCEBFF"/><circle cx="250" cy="64" r="38" fill="#FFE066" opacity=".3"/><circle cx="250" cy="64" r="26" fill="#FFE066"/>${cloud(20, 96, .8)}${cloud(196, 140, .6)}<g fill="#C9B6FF"><rect x="14" y="230" width="46" height="120"/><rect x="240" y="230" width="46" height="120"/><rect x="14" y="290" width="272" height="60"/><rect x="8" y="212" width="58" height="22"/><rect x="234" y="212" width="58" height="22"/></g><path d="M6 212L37 170L68 212Z" fill="#8C6BFF"/><path d="M232 212L263 170L294 212Z" fill="#8C6BFF"/><path d="M37 170V148L54 156L37 164Z" fill="#FF6B8A"/><path d="M263 170V148L280 156L263 164Z" fill="#FF6B8A"/><g fill="#7B5CE5"><rect x="30" y="250" width="14" height="22" rx="7"/><rect x="256" y="250" width="14" height="22" rx="7"/></g><rect y="346" width="300" height="54" fill="#B9E4A0"/><ellipse cx="150" cy="374" rx="84" ry="14" fill="#E8D5A6"/>` },
    { n: '정원', svg: `<rect width="300" height="400" fill="#E3F7FF"/><circle cx="252" cy="58" r="40" fill="#FFE066" opacity=".3"/><circle cx="252" cy="58" r="28" fill="#FFE066"/>${cloud(30, 110, .7)}${cloud(180, 80, .5)}<ellipse cx="60" cy="380" rx="200" ry="70" fill="#A8E6A1"/><ellipse cx="260" cy="392" rx="200" ry="80" fill="#8FD98A"/>${tulip(24, 380, '#FF6B8A')}${tulip(46, 392, '#FFD23F')}${tulip(272, 382, '#FF8FB1')}${tulip(250, 396, '#FF9E5E')}<text x="26" y="150" font-size="28">🦋</text><text x="240" y="160" font-size="22">🐝</text>` },
    { n: '바다', svg: `<rect width="300" height="400" fill="#CFF2FF"/><circle cx="50" cy="56" r="36" fill="#FFE066" opacity=".3"/><circle cx="50" cy="56" r="24" fill="#FFE066"/>${cloud(160, 60, .6)}${cloud(230, 120, .5)}<path d="M36 156q8-8 16 0q8-8 16 0M220 190q7-7 14 0q7-7 14 0" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/><rect y="300" width="300" height="100" fill="#4FB8F0"/><path d="M0 300Q25 288 50 300T100 300T150 300T200 300T250 300T300 300V322H0Z" fill="#8FD9FF"/><path d="M0 332Q25 322 50 332T100 332T150 332T200 332T250 332T300 332V346H0Z" fill="#6FCBFF"/><rect y="362" width="300" height="38" fill="#F8E3A8"/><text x="226" y="262" font-size="30">🐬</text><text x="18" y="392" font-size="22">🐚</text><text x="262" y="394" font-size="20">⭐</text>` },
    { n: '밤하늘', svg: `<rect width="300" height="400" fill="#2B2A5A"/><circle cx="56" cy="70" r="26" fill="#FFF3B0"/><circle cx="68" cy="60" r="22" fill="#2B2A5A"/><g fill="#FFE066"><circle cx="230" cy="40" r="3"/><circle cx="270" cy="90" r="2.5"/><circle cx="110" cy="40" r="2"/><circle cx="250" cy="150" r="3"/><circle cx="40" cy="160" r="2"/><circle cx="280" cy="210" r="2.5"/><circle cx="20" cy="230" r="2"/><circle cx="150" cy="30" r="2"/></g><text x="196" y="112" font-size="20">⭐</text><text x="24" y="122" font-size="14">⭐</text><ellipse cx="80" cy="400" rx="220" ry="60" fill="#3F3D7A"/><ellipse cx="280" cy="410" rx="200" ry="70" fill="#35336B"/><g fill="#FFE066" opacity=".85"><circle cx="40" cy="300" r="3"/><circle cx="262" cy="280" r="3"/><circle cx="30" cy="350" r="2.5"/><circle cx="276" cy="330" r="2.5"/></g>` },
    { n: '파티', svg: `<rect width="300" height="400" fill="#FFF0F6"/><path d="M0 60Q150 110 300 60" stroke="#B49BFF" stroke-width="3" fill="none"/>${flagsOn}<g><ellipse cx="34" cy="160" rx="18" ry="22" fill="#FF7A8A"/><path d="M34 182v40" stroke="#B49BFF" stroke-width="2"/><ellipse cx="268" cy="150" rx="18" ry="22" fill="#6EC6FF"/><path d="M268 172v40" stroke="#B49BFF" stroke-width="2"/><ellipse cx="52" cy="240" rx="16" ry="20" fill="#FFD166"/><path d="M52 260v34" stroke="#B49BFF" stroke-width="2"/></g><g><circle cx="90" cy="130" r="5" fill="#FFD166"/><circle cx="120" cy="40" r="5" fill="#4FD1A5"/><circle cx="200" cy="140" r="5" fill="#6EC6FF"/><circle cx="240" cy="230" r="5" fill="#FF7A8A"/><circle cx="24" cy="300" r="5" fill="#B49BFF"/></g><rect y="350" width="300" height="50" fill="#FFD6E7"/><text x="10" y="346" font-size="30">🎂</text><text x="256" y="348" font-size="30">🎁</text>` },
    { n: '무지개', svg: `<rect width="300" height="400" fill="#E3F7FF"/><circle cx="46" cy="52" r="22" fill="#FFE066"/><path d="M0 250A150 150 0 0 1 300 250" stroke="#FF7A8A" stroke-width="14" fill="none"/><path d="M14 250A136 136 0 0 1 286 250" stroke="#FFD166" stroke-width="14" fill="none"/><path d="M28 250A122 122 0 0 1 272 250" stroke="#4FD1A5" stroke-width="14" fill="none"/><path d="M42 250A108 108 0 0 1 258 250" stroke="#6EC6FF" stroke-width="14" fill="none"/><path d="M56 250A94 94 0 0 1 244 250" stroke="#B49BFF" stroke-width="14" fill="none"/>${cloud(-6, 250, 1)}${cloud(238, 250, 1)}<ellipse cx="60" cy="390" rx="200" ry="60" fill="#A8E6A1"/><ellipse cx="260" cy="400" rx="200" ry="70" fill="#8FD98A"/>` }
  ];
  const TABS = [
    { id: 'hair', emo: '💇', label: '머리', rows: [{ key: 'hair', opts: HAIR, kind: 'hair' }, { key: 'hairColor', opts: HAIRC, kind: 'color' }, { key: 'skin', opts: SKIN, kind: 'color' }] },
    { id: 'dress', emo: '👗', label: '드레스', rows: [{ key: 'dress', opts: DRESS, kind: 'dress' }] },
    { id: 'acc', emo: '👑', label: '장식', rows: [{ key: 'acc', opts: ACC, kind: 'label' }] },
    { id: 'pet', emo: '🐰', label: '친구', rows: [{ key: 'pet', opts: PET, kind: 'label' }] },
    { id: 'bg', emo: '🏰', label: '배경', rows: [{ key: 'bg', opts: BG, kind: 'bg' }] }
  ];
  const stage = $('#stage'), tabsEl = $('#tabs'), rowsEl = $('#optrows');
  let s = { hair: 0, hairColor: 0, skin: 0, dress: 0, acc: 1, pet: 1, bg: 0 }, tab = 'hair';

  function face(skin, eye, hc) {
    return `<rect x="142" y="158" width="16" height="24" fill="${skin}"/>
      <circle cx="150" cy="122" r="46" fill="${skin}"/>
      <g fill="#fff"><ellipse cx="133" cy="123" rx="9" ry="11"/><ellipse cx="167" cy="123" rx="9" ry="11"/></g>
      <g fill="${eye}"><circle cx="134" cy="124" r="6.5"/><circle cx="168" cy="124" r="6.5"/></g>
      <g fill="#2B2B2B"><circle cx="134" cy="124" r="3.5"/><circle cx="168" cy="124" r="3.5"/></g>
      <g fill="#fff"><circle cx="136.5" cy="120" r="2.4"/><circle cx="170.5" cy="120" r="2.4"/></g>
      <g stroke="#2B2B2B" stroke-width="2.2" stroke-linecap="round" fill="none"><path d="M124 116Q133 108 142 116M158 116Q167 108 176 116"/><path d="M124 115l-4-3M126 111l-3-4M176 115l4-3M174 111l3-4"/></g>
      <g stroke="${hc}" stroke-width="2.5" stroke-linecap="round" fill="none"><path d="M124 105Q133 100 142 105M158 105Q167 100 176 105"/></g>
      <g fill="#FF8FB1" opacity=".55"><circle cx="122" cy="140" r="7"/><circle cx="178" cy="140" r="7"/></g>
      <path d="M147 134q3 3 6 0" stroke="#E0A98F" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M138 146Q150 158 162 146" fill="none" stroke="#D25A77" stroke-width="3" stroke-linecap="round"/>`;
  }
  function scene(st) {
    const skin = SKIN[st.skin], hc = HAIRC[st.hairColor], d = DRESS[st.dress];
    return `${BG[st.bg].svg}
      <ellipse cx="150" cy="366" rx="76" ry="9" fill="rgba(70,58,107,.10)"/>
      ${d.behind || ''}
      <g fill="${hc}">${HAIR[st.hair].back}</g>
      <g fill="${skin}"><rect x="132" y="296" width="14" height="52" rx="7"/><rect x="154" y="296" width="14" height="52" rx="7"/></g>
      <g fill="#E03C7A"><ellipse cx="139" cy="352" rx="15" ry="7"/><ellipse cx="161" cy="352" rx="15" ry="7"/></g>
      ${d.svg}
      <g stroke="${skin}" stroke-width="16" stroke-linecap="round" fill="none"><path d="M122 188L94 252"/><path d="M178 188L206 252"/></g>
      <g fill="${d.sleeve}"><circle cx="121" cy="188" r="14"/><circle cx="179" cy="188" r="14"/></g>
      ${face(skin, EYEC[st.hairColor], hc)}
      <g fill="${hc}">${HAIR[st.hair].front}</g>
      ${GLOSS}
      ${ACC[st.acc].svg}
      ${PET[st.pet].svg}`;
  }
  const wrap = (inner, vb) => `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${inner}</svg>`;
  function render() {
    stage.innerHTML = `<svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="공주 그림">${scene(s)}</svg>`;
  }
  function optContent(row, o) {
    const skin = SKIN[s.skin], hc = HAIRC[s.hairColor];
    switch (row.kind) {
      case 'color': return `<span class="sw" style="background:${o}"></span>`;
      case 'hair': return wrap(`<rect width="300" height="400" fill="#F3EDFF"/><g fill="${hc}">${o.back}</g><circle cx="150" cy="122" r="46" fill="${skin}"/><g fill="${hc}">${o.front}</g>`, '60 30 180 260');
      case 'dress': return wrap(`<rect width="300" height="400" fill="#F3EDFF"/>${o.behind || ''}${o.svg}`, '40 160 220 210');
      case 'bg': return wrap(o.svg, '0 0 300 400');
      default: return o.label;
    }
  }
  function renderTabs() {
    tabsEl.innerHTML = '';
    TABS.forEach(t => {
      const b = document.createElement('button');
      b.className = 'tab' + (t.id === tab ? ' on' : '');
      b.innerHTML = `<span class="t-emo">${t.emo}</span><span>${t.label}</span>`;
      b.addEventListener('click', () => { tab = t.id; Snd.tick(); renderTabs(); renderRows(); });
      tabsEl.appendChild(b);
    });
  }
  function renderRows() {
    rowsEl.innerHTML = '';
    TABS.find(t => t.id === tab).rows.forEach(row => {
      const r = document.createElement('div'); r.className = 'opts';
      row.opts.forEach((o, i) => {
        const b = document.createElement('button');
        b.className = 'opt' + (s[row.key] === i ? ' on' : '');
        b.innerHTML = optContent(row, o);
        b.setAttribute('aria-label', typeof o === 'string' ? o : o.n);
        b.addEventListener('click', () => { s[row.key] = i; Snd.tick(); render(); renderRows(); });
        r.appendChild(b);
      });
      rowsEl.appendChild(r);
    });
  }
  function start() { render(); renderTabs(); renderRows(); }
  $('#dress-random').addEventListener('click', () => {
    s = { hair: rnd(HAIR.length), hairColor: rnd(HAIRC.length), skin: rnd(SKIN.length), dress: rnd(DRESS.length), acc: rnd(ACC.length), pet: rnd(PET.length), bg: rnd(BG.length) };
    Snd.ding(); render(); renderRows();
  });
  $('#dress-done').addEventListener('click', () => celebrate('dress', '예쁜 공주님이 완성됐어요!', `<svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">${scene(s)}</svg><small>내가 꾸민 공주님</small>`));
  return { start };
})();

/* ===== 시작 ===== */
function boot(data) {
  try { if (data && data.stickers) { stickers = data.stickers; store.set('stickers', stickers); } } catch (e) {}
  renderStickers();
  show((data && data.screen) || 'hub');
}
try {
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ screen: current, stickers }));
  if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
} catch (e) { boot({}); }
</script>

</body>
</html>
